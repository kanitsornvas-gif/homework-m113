<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework M.113 - V.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .app-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f43f5e;
      letter-spacing: 0.5px;
    }

    .badge-m113 {
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }

    .tag-superpower {
      display: inline-block;
      background-color: #fce7f3;
      color: #ec4899;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8b5cf6;
      font-size: 1rem;
      padding: 2px;
    }

    .logout-btn {
      color: #f43f5e;
      font-size: 0.75rem;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Buttons Grid */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      border: none;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-pink-soft {
      background-color: #f472b6;
      color: #ffffff;
    }

    .btn-gray-soft {
      background-color: #f1f5f9;
      color: #94a3b8;
    }

    .btn-pink-main {
      background-color: #ec4899;
      color: #ffffff;
    }

    .btn-cyan-main {
      background-color: #38bdf8;
      color: #ffffff;
    }

    /* Notice */
    .notice-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .badge-notice {
      background-color: #ec4899;
      color: white;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .notice-text {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Pinned Section */
    .section-pinned {
      background-color: #fffdf0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .pinned-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .empty-pinned {
      text-align: center;
      color: #f59e0b;
      font-size: 0.8rem;
      padding: 6px 0;
      font-weight: 400;
    }

    /* Active Tasks Section */
    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .tasks-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .tasks-count {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
    }

    /* Task Card Item */
    .task-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #f8fafc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .task-author {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .author-icon {
      width: 16px;
      height: 16px;
      background-color: #ec4899;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: bold;
    }

    .task-content {
      font-size: 0.95rem;
      color: #0f172a;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .task-dates {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 0.7rem;
      color: #f43f5e;
    }

    /* Modal ป๊อปอัปเพิ่มงาน */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-cancel {
      background: #f1f5f9;
      color: #64748b;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-submit {
      background: #ec4899;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Header Section -->
    <div class="header">
      <div>
        <div class="title-group">
          <span class="title">HOMEWORK</span>
          <span class="badge-m113">M113</span>
        </div>
        <div>
          <span class="tag-superpower">Superpower</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="loadTasks()">🔄</button>
        <button class="icon-btn">📑</button>
        <button class="icon-btn">🔄</button>
        <button class="logout-btn">LOGOUT</button>
      </div>
    </div>

    <!-- Action Grid Buttons -->
    <div class="action-grid">
      <button class="btn btn-pink-soft">งานค้าง</button>
      <button class="btn btn-gray-soft">ปฏิทินงาน</button>
      <button class="btn btn-pink-main" onclick="openModal()">+ เพิ่มงานค้าง</button>
      <button class="btn btn-cyan-main">★ สร้างกิจกรรม</button>
    </div>

    <!-- Notice -->
    <div class="notice-box">
      <span class="badge-notice">📢 NOTICE</span>
      <span class="notice-text">แสดงรายการการบ้านที่ค้างอยู่ทั้งหมด</span>
    </div>

    <!-- Pinned Section -->
    <div class="section-pinned">
      <div class="pinned-title">📌 ปักหมุดไว้</div>
      <div class="empty-pinned">ไม่มีรายการที่ปักหมุดไว้</div>
    </div>

    <!-- Active Tasks Section -->
    <div class="tasks-header">
      <span class="tasks-title">ROOM ACTIVE TASKS</span>
      <span class="tasks-count" id="task-count">0 ITEMS</span>
    </div>

    <div id="tasks-container">
      <div style="text-align: center; color: #cbd5e1; font-size: 0.8rem; padding: 16px;">
        กำลังโหลดข้อมูล...
      </div>
    </div>
  </div>

  <!-- Modal สำหรับกด + เพิ่มงานค้าง -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-title">เพิ่มงานค้างใหม่</div>
      <form id="addHomeworkForm">
        <div class="form-group">
          <label>รหัสวิชา / วิชา</label>
          <input type="text" id="subject" placeholder="เช่น ภาษาไทย">
        </div>
        <div class="form-group">
          <label>รายละเอียดการบ้าน</label>
          <textarea id="detail" rows="2" placeholder="เช่น รายละเอียด..." required></textarea>
        </div>
        <div class="form-group">
          <label>กำหนดส่ง</label>
          <input type="date" id="dueDate" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
          <button type="submit" class="btn-submit" id="submitBtn">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // URL Apps Script ของคุณ
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbZpeF0Pz21CQRoDtp-z11v6en9Tyjzo6tER6gyFFXDZpTS1AdYWP7cVl6Fstq-k2y/exec';

    function openModal() {
      document.getElementById('addModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('addModal').style.display = 'none';
      document.getElementById('addHomeworkForm').reset();
    }

    // ดึงการบ้านจาก Google Sheets
    async function loadTasks() {
      const container = document.getElementById('tasks-container');
      const countEl = document.getElementById('task-count');
      
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();

        if (result.status === 'success' && result.data) {
          const tasks = result.data;
          countEl.innerText = `${tasks.length} ITEMS`;

          if (tasks.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #cbd5e1; font-size: 0.8rem; padding: 16px;">ไม่มีการบ้านค้างอยู่</div>';
            return;
          }

          container.innerHTML = tasks.map(task => `
            <div class="task-card">
              <div class="task-author">
                <div class="author-icon">t</div>
                <span>โดย: ${task.CreatedBy || 'Superpower'}</span>
              </div>
              <div class="task-content">
                ${task.Subject ? `[${task.Subject}] ` : ''}${task.Detail || task.title || '-'}
              </div>
              <div class="task-dates">
                <div>📋 สั่ง: ${formatDate(task.Timestamp)}</div>
                <div>⌛ ส่ง: ${formatDate(task.DueDate)}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading tasks:', error);
        container.innerHTML = '<div style="text-align: center; color: #ef4444; font-size: 0.8rem; padding: 16px;">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
      }
    }

    // บันทึกการบ้านใหม่ลง Google Sheets
    document.getElementById('addHomeworkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = 'กำลังบันทึก...';
      submitBtn.disabled = true;

      const newHomework = {
        subject: document.getElementById('subject').value,
        detail: document.getElementById('detail').value,
        dueDate: document.getElementById('dueDate').value,
        createdBy: 'Superpower'
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(newHomework)
        });

        const result = await response.json();

        if (result.status === 'success') {
          closeModal();
          loadTasks();
        } else {
          alert('เกิดข้อผิดพลาด: ' + result.message);
        }
      } catch (error) {
        console.error('Error adding homework:', error);
        alert('บันทึกไม่สำเร็จ กรุณาเช็กการเชื่อมต่อ');
      } finally {
        submitBtn.innerText = 'บันทึก';
        submitBtn.disabled = false;
      }
    });

    // รูปแบบการแสดงวันที่ให้ตรงกับของเดิม (พฤ. 8 ต.ค. 69)
    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      
      const days = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      
      const dayName = days[d.getDay()];
      const day = d.getDate();
      const monthName = months[d.getMonth()];
      const year = (d.getFullYear() + 543).toString().slice(-2);

      return `${dayName} ${day} ${monthName} ${year}`;
    }

    // โหลดการบ้านทันทีเมื่อเปิดหน้าเว็บ
    loadTasks();
  </script>
</body>
</html>
