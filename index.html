
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework M.113</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 16px;
      background: #f2f6ff;
      color: #20304a;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0001;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd4e0; }
    button {
      border: 0;
      background: #3568d4;
      color: white;
      cursor: pointer;
    }
    #status { white-space: pre-wrap; margin-top: 14px; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Homework M.113</h1>
    <h2>บันทึกกิจกรรม</h2>

    <label for="eventDate">วันที่</label>
    <input id="eventDate" type="date">

    <label for="eventText">กิจกรรม / การบ้าน</label>
    <input id="eventText" type="text"
           placeholder="พิมพ์กิจกรรมที่ต้องทำ">

    <button id="saveBtn" onclick="saveEvent()">บันทึกกิจกรรม</button>
    <button onclick="loadEvents()">โหลดกิจกรรม</button>

    <p id="status">พร้อมใช้งาน</p>
    <ul id="eventList"></ul>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxj4EvTJRFfYPhRSY5vn87lxaaauPmfF3KeHbN-rrwnzBJa645u5R5qV4vCyhLmD4Ir9A/exec";

    const statusEl = document.getElementById("status");
    const dateEl = document.getElementById("eventDate");
    const textEl = document.getElementById("eventText");
    const listEl = document.getElementById("eventList");

    dateEl.value = new Date().toLocaleDateString("en-CA");

    async function loadEvents() {
      statusEl.textContent = "กำลังโหลด...";
      try {
        const response = await fetch(
          SCRIPT_URL + "?type=events&t=" + Date.now()
        );
        const data = await response.json();

        if (data.status !== "success" || !data.events) {
          throw new Error(data.message || "รูปแบบข้อมูลไม่ถูกต้อง");
        }

        listEl.replaceChildren();
        const events = data.events[dateEl.value] || [];

        events.forEach(event => {
          const li = document.createElement("li");
          li.textContent = event;
          listEl.appendChild(li);
        });

        statusEl.textContent = events.length
          ? "โหลดกิจกรรมสำเร็จ"
          : "ยังไม่มีกิจกรรมในวันที่เลือก";
      } catch (error) {
        statusEl.textContent =
          "โหลดไม่สำเร็จ: " + error.message +
          "\nตรวจสอบ URL และการ Deploy ของ Apps Script";
      }
    }

    async function saveEvent() {
      const date = dateEl.value;
      const eventText = textEl.value.trim();

      if (!date || !eventText) {
        statusEl.textContent = "กรุณาเลือกวันที่และกรอกกิจกรรม";
        return;
      }

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      statusEl.textContent = "กำลังบันทึก...";

      try {
        // โหลดกิจกรรมเดิมก่อน เพื่อไม่เขียนทับกิจกรรมอื่นในวันเดียวกัน
        const response = await fetch(
          SCRIPT_URL + "?type=events&t=" + Date.now()
        );
        const data = await response.json();

        if (data.status !== "success" || !data.events) {
          throw new Error(data.message || "โหลดข้อมูลเดิมไม่ได้");
        }

        const events = data.events[date] || [];
        events.push(eventText);

        const url = SCRIPT_URL +
          "?type=saveEvent" +
          "&date=" + encodeURIComponent(date) +
          "&events=" + encodeURIComponent(JSON.stringify(events));

        const saveResponse = await fetch(url);
        const result = await saveResponse.json();

        if (result.status !== "success") {
          throw new Error(result.message || "เซิร์ฟเวอร์ปฏิเสธการบันทึก");
        }

        textEl.value = "";
        statusEl.textContent = "บันทึกสำเร็จ ✓";
        await loadEvents();
      } catch (error) {
        statusEl.textContent =
          "บันทึกไม่สำเร็จ: " + error.message +
          "\nตรวจสอบว่า Apps Script Deploy เป็น Web app และตั้งสิทธิ์การเข้าถึงถูกต้อง";
      } finally {
        btn.disabled = false;
      }
    }

    dateEl.addEventListener("change", loadEvents);
    loadEvents();
  </script>
</body>
</html>
